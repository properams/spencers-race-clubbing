# Atelier optimize — draait de asset-pipeline in CI zodat de hele flow
# vanaf een telefoon kan (een telefoon kan geen Node draaien).
#
# Twee routes op master:
#  1. atelier/assets/raw/** — een handmatig gedownloade raw GLB (bv. via
#     github.com ▸ Upload files), of handmatig via "Run workflow" met een
#     tris-doel. Draait weld → dedup → simplify → pivot-to-foot → meshopt.
#  2. atelier/concepts/** — een concept-PNG/JPG. Genereert eerst zelf een raw
#     GLB via fal.ai (model-id: zie FAL_MODEL_ID hieronder), cachet die naar
#     atelier/assets/raw/<id>_raw.glb, en loopt daarna door dezelfde
#     optimize-stappen als route 1.
# Resultaat (beide routes): genormaliseerde GLB in atelier/assets/clean/ +
# entry in atelier/manifest.json, teruggecommit naar master → Vercel
# redeployt.
#
# Volledig atelier-scoped: raakt uitsluitend atelier/**. Alle commits in deze
# job gebruiken de ingebouwde GITHUB_TOKEN; pushes daarmee triggeren van
# nature geen nieuwe workflow-runs, dus er kan geen lus ontstaan — ook niet
# doordat route 2 zelf naar atelier/assets/raw/ schrijft en committeert. Elke
# auto-commit draagt bovendien [skip ci] als extra vangnet.
name: atelier-optimize

env:
  # image→3D-model op fal.ai voor de concepts/-route. fal-ai/trellis-2 is de
  # zwaardere (duurdere, hogere-kwaliteit) variant — bewust niet gekozen.
  FAL_MODEL_ID: fal-ai/trellis

on:
  push:
    branches: [master]
    paths:
      - 'atelier/assets/raw/**'
      - 'atelier/concepts/**'
  workflow_dispatch:
    inputs:
      file:
        description: 'Raw GLB (pad of bestandsnaam; leeg = alle raws zonder clean)'
        required: false
        default: ''
      tris:
        description: 'Tris-doel voor simplify'
        required: false
        default: '5000'

permissions:
  contents: write

concurrency:
  group: atelier-optimize
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installeer pipeline-deps
        working-directory: atelier/pipeline
        run: npm ci

      - name: Bepaal en optimaliseer raw-assets
        env:
          EVENT: ${{ github.event_name }}
          IN_FILE: ${{ github.event.inputs.file }}
          IN_TRIS: ${{ github.event.inputs.tris }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TRIS="${IN_TRIS:-5000}"
          declare -a FILES=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${IN_FILE:-}" ]; then
            case "$IN_FILE" in
              atelier/assets/raw/*) FILES+=("$IN_FILE") ;;
              */*)                   FILES+=("$IN_FILE") ;;
              *)                     FILES+=("atelier/assets/raw/$IN_FILE") ;;
            esac
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            for r in atelier/assets/raw/*.glb; do
              [ -e "$r" ] || continue
              id="$(basename "$r" .glb)"; id="${id%_raw}"
              [ -e "atelier/assets/clean/$id.glb" ] || FILES+=("$r")
            done
          else
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              CHANGED="$(git show --no-commit-id --name-only --pretty="" "$SHA")"
            else
              CHANGED="$(git diff --name-only "$BEFORE" "$SHA")"
            fi
            while IFS= read -r line; do
              [ -n "$line" ] && FILES+=("$line")
            done < <(printf '%s\n' "$CHANGED" | grep -E '^atelier/assets/raw/.*\.glb$' || true)
          fi
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Geen raw-GLB om te verwerken."
            exit 0
          fi
          for f in "${FILES[@]}"; do
            if [ ! -e "$f" ]; then echo "overslaan (bestaat niet): $f"; continue; fi
            echo "::group::optimize $f (tris=$TRIS)"
            node atelier/pipeline/optimize.mjs "$f" --tris "$TRIS"
            echo "::endgroup::"
          done

      - name: Commit clean + manifest terug
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atelier/assets/clean atelier/manifest.json
          if git diff --cached --quiet; then
            echo "Niets veranderd — geen commit."
            exit 0
          fi
          git commit -m "atelier: optimize assets (auto) [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Bepaal en verwerk concept-assets (image→3D via fal.ai)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git show --no-commit-id --name-only --pretty="" "$SHA")"
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$SHA")"
          fi
          declare -a CONCEPTS=()
          while IFS= read -r line; do
            [ -n "$line" ] && CONCEPTS+=("$line")
          done < <(printf '%s\n' "$CHANGED" | grep -E '^atelier/concepts/.*\.(png|jpg)$' || true)
          if [ "${#CONCEPTS[@]}" -eq 0 ]; then
            echo "Geen nieuwe/gewijzigde concept-afbeeldingen."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync naar de actuele master-tip vóór de idempotentie-checks: bij
          # een "Re-run failed jobs" checkt actions/checkout de oorspronkelijke
          # push-SHA uit, die ouder kan zijn dan wat een eerdere (deels
          # geslaagde) poging al naar master pushte. Zonder deze sync zou de
          # cache-check hieronder ten onrechte denken dat er nog niets gedaan
          # is, en een al betaalde fal-call herhalen.
          git fetch origin master
          git reset --hard origin/master

          for f in "${CONCEPTS[@]}"; do
            if [ ! -e "$f" ]; then echo "overslaan (bestaat niet meer): $f"; continue; fi
            naam="$(basename "$f")"
            id="${naam%.*}"
            if ! [[ "$naam" =~ ^[a-z0-9][a-z0-9_]*\.(png|jpg)$ ]]; then
              echo "::warning::overslaan — voldoet niet aan de naamconventie (kleine letters/cijfers/underscores + .png of .jpg): $f"
              continue
            fi

            clean="atelier/assets/clean/${id}.glb"
            raw="atelier/assets/raw/${id}_raw.glb"

            if [ -e "$clean" ] && node -e "
              const m = JSON.parse(require('fs').readFileSync('atelier/manifest.json', 'utf8'));
              process.exit((m.entries || []).some((e) => e.id === '${id}') ? 0 : 1);
            "; then
              echo "overslaan (al verwerkt): $id"
              continue
            fi

            echo "::group::concept→3D $f (id=$id)"
            if [ -e "$raw" ]; then
              echo "fal-call overgeslagen — raw-GLB al gecached: $raw"
            else
              node atelier/pipeline/fal-image-to-3d.mjs "$f" --id "$id" --out "$raw"
            fi
            node atelier/pipeline/optimize.mjs "$raw" --id "$id" --tris 5000 --status review
            echo "::endgroup::"

            git add atelier/assets/raw atelier/assets/clean atelier/manifest.json
            if git diff --cached --quiet; then
              echo "niets om te committen voor $id"
            else
              git commit -m "atelier: concept→3D $id (auto) [skip ci]"
              git pull --rebase origin master
              git push origin HEAD:master
            fi
          done
